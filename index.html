<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tạo Hóa Đơn</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f3f6fb;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    margin-bottom:20px;
    color:#2563eb;
}

.form-group{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
}

td input{
    border:none;
    outline:none;
}

.btn{
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.add{
    background:#16a34a;
}

.create{
    background:#2563eb;
}

.print{
    background:#ea580c;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.invoice{
    margin-top:30px;
    display:none;
}

.invoice-header{
    text-align:center;
    margin-bottom:20px;
}

.invoice-header h2{
    color:#2563eb;
}

.total{
    text-align:right;
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    color:#dc2626;
}

@media print{

body{
background:white;
padding:0;
}

.card > *:not(.invoice){
display:none;
}

.invoice{
display:block !important;
}

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Tạo Hóa Đơn</h1>

<div class="form-group">
<input type="text" id="customer" placeholder="Tên khách hàng">
</div>

<table id="productTable">

<thead>
<tr>
<th>Tên sản phẩm</th>
<th>Giá tiền</th>
</tr>
</thead>

<tbody id="productBody">

<tr>
<td>
<input type="text" placeholder="Tên sản phẩm">
</td>

<td>
<input type="number" placeholder="Giá">
</td>
</tr>

</tbody>

</table>

<div class="actions">

<button class="btn add" onclick="addRow()">
+ Thêm sản phẩm
</button>

<button class="btn create" onclick="generateInvoice()">
Tạo hóa đơn
</button>

<button class="btn print" onclick="window.print()">
In hóa đơn
</button>

</div>

<div class="invoice" id="invoice">

<div class="invoice-header">

<h2>HÓA ĐƠN THANH TOÁN</h2>

<p>Mã hóa đơn:
<span id="invoiceCode"></span>
</p>

<p>
Khách hàng:
<b id="invoiceCustomer"></b>
</p>

</div>

<table>

<thead>

<tr>
<th>Sản phẩm</th>
<th>Giá tiền</th>
</tr>

</thead>

<tbody id="invoiceProducts">
</tbody>

</table>

<div class="total">
Tổng tiền:
<span id="invoiceTotal">0</span>đ
</div>

</div>

</div>

</div>

<script>

function addRow(){

let row = document.createElement("tr");

row.innerHTML = `
<td>
<input type="text"
placeholder="Tên sản phẩm">
</td>

<td>
<input type="number"
placeholder="Giá">
</td>
`;

document
.getElementById("productBody")
.appendChild(row);

}

function formatMoney(x){

return Number(x)
.toLocaleString("vi-VN");

}

function generateInvoice(){

const rows =
document.querySelectorAll(
"#productBody tr"
);

let html = "";

let total = 0;

rows.forEach(row=>{

const name =
row.cells[0]
.querySelector("input")
.value;

const price =
parseFloat(
row.cells[1]
.querySelector("input")
.value
) || 0;

if(name.trim()!=""){

total += price;

html += `
<tr>
<td>${name}</td>
<td>${formatMoney(price)}đ</td>
</tr>
`;

}

});

document
.getElementById(
"invoiceProducts"
).innerHTML = html;

document
.getElementById(
"invoiceTotal"
).innerText =
formatMoney(total);

document
.getElementById(
"invoiceCustomer"
).innerText =
document
.getElementById(
"customer"
).value;

document
.getElementById(
"invoiceCode"
).innerText =
"HD" + Date.now();

document
.getElementById(
"invoice"
).style.display =
"block";

}

document.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

let active =
document.activeElement;

if(
active.type==="number"
){

e.preventDefault();

addRow();

}

}

});

</script>

</body>
</html>
